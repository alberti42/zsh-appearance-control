name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

# Signing and notarization of the macOS watcher.
#
# Required repository secrets (they are per-repository, so they must be set here
# even if another repository of yours already has them):
#   CERTIFICATE_BASE64    base64 of the "Developer ID Application" .p12
#   CERTIFICATE_PASSWORD  password protecting that .p12
#   APPLE_ID              Apple ID used for notarization
#   APPLE_ID_PASSWORD     app-specific password for that Apple ID
#
# Without them the watcher still builds and the release still happens: the
# binary then carries only the ad-hoc signature the linker gives it, and a
# browser-downloaded copy is blocked by Gatekeeper. The signing steps are
# skipped rather than failed, so a fork can build this workflow.
env:
  TEAM_ID: 9V3X7C8VCK

jobs:
  # The macOS watcher is a compiled artifact, so it needs a Darwin runner.
  build-watcher:
    runs-on: macos-latest
    # Job level, not step level: an `if:` that reads `env.` must see a variable
    # defined outside the step it guards.
    env:
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only when the certificate is available: see the note above.
      - name: Import the signing certificate
        id: keychain
        if: env.CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 20)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "codesign_id=Developer ID Application: Andrea Alberti ($TEAM_ID)" >> "$GITHUB_OUTPUT"

      # make-watcher signs the build product in place when ZAC_CODESIGN_ID is
      # set, then packages it. Empty identity = ad-hoc, and the build still runs.
      - name: Build universal watcher binary
        env:
          ZAC_CODESIGN_ID: ${{ steps.keychain.outputs.codesign_id }}
        run: |
          chmod +x bin/make-watcher
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            zsh -f bin/make-watcher "${{ inputs.tag }}"
          else
            zsh -f bin/make-watcher "${{ github.ref_name }}"
          fi

      - name: Notarize
        if: steps.keychain.outputs.codesign_id != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          set -euo pipefail
          BIN=watchers/macos/.build/apple/Products/Release/zac-watch-macos

          # notarytool takes a zip, a dmg or a pkg, never a bare executable.
          # This zip exists only to submit; what ships is the zip make-watcher
          # built, and it carries the same signed bytes.
          ditto -c -k "$BIN" "$RUNNER_TEMP/submit.zip"

          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID"

          # `--wait` has returned 0 on a rejected submission, so read the status
          # instead of trusting the exit code.
          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --keychain-profile "notary-profile" --wait \
            | tee "$RUNNER_TEMP/notary.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.log" || {
            echo "::error::notarization was not accepted"; cat "$RUNNER_TEMP/notary.log"; exit 1; }

          # The ticket is not stapled, and cannot be: `stapler` handles disk
          # images, code-signed bundles and installer packages, and a bare
          # Mach-O is none of them. Notarization still counts — the ticket is
          # registered against the cdhash — but a quarantined copy needs an
          # online check on first run.

      # Catches a hardened-runtime failure, which only shows on the signed build.
      - name: Smoke test the packaged binary
        run: |
          set -euo pipefail
          BIN=watchers/macos/.build/apple/Products/Release/zac-watch-macos
          lipo -archs "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          "$BIN" --version
          "$BIN" --print

      - name: Clean up the keychain
        if: always() && steps.keychain.outcome == 'success'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true

      - name: Upload watcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: watcher
          path: dist/*.zip
          if-no-files-found: error

  build-and-release:
    needs: build-watcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zsh is available
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi

      - name: Build release zip
        run: |
          chmod +x bin/make-release-zip bin/make-extras bin/make-watcher-linux
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          zsh -f bin/make-release-zip "$TAG"
          zsh -f bin/make-extras "$TAG"
          # The Linux watcher is a script: no compiler, no extra runner.
          zsh -f bin/make-watcher-linux "$TAG"

      - name: Download watcher artifact
        uses: actions/download-artifact@v4
        with:
          name: watcher
          path: dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          chmod +x bin/changelog
          mkdir -p dist
          zsh -f bin/changelog section "$TAG" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: true
