name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # The macOS watcher is a compiled artifact, so it needs a Darwin runner.
  build-watcher:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal watcher binary
        run: |
          chmod +x bin/make-watcher
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            zsh -f bin/make-watcher "${{ inputs.tag }}"
          else
            zsh -f bin/make-watcher "${{ github.ref_name }}"
          fi

      - name: Upload watcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: watcher
          path: dist/*.zip
          if-no-files-found: error

  build-and-release:
    needs: build-watcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zsh is available
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi

      - name: Build release zip
        run: |
          chmod +x bin/make-release-zip bin/make-extras
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            zsh -f bin/make-release-zip "${{ inputs.tag }}"
            zsh -f bin/make-extras "${{ inputs.tag }}"
          else
            zsh -f bin/make-release-zip "${{ github.ref_name }}"
            zsh -f bin/make-extras "${{ github.ref_name }}"
          fi

      - name: Download watcher artifact
        uses: actions/download-artifact@v4
        with:
          name: watcher
          path: dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          chmod +x bin/changelog
          mkdir -p dist
          zsh -f bin/changelog section "$TAG" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: true
