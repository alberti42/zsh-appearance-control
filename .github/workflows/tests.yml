name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # Without the binary its tests are skipped, not failed.
      - name: Build the macOS watcher
        if: runner.os == 'macOS'
        run: make watcher-macos

      - name: Run the tests
        run: |
          zsh --version
          make test
