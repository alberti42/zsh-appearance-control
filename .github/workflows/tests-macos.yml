name: Tests (macOS)

# One workflow per platform, so that each has its own README badge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Without the binary its tests are skipped, not failed.
      - name: Build the macOS watcher
        run: make watcher-macos

      - name: Run the tests
        run: |
          zsh --version
          make test
