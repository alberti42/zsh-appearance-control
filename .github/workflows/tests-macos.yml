name: Tests (macOS)

# One workflow per platform, so that each has its own README badge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Without the binary its tests are skipped, not failed.
      - name: Build the macOS watcher
        run: make watcher-macos

      # The runner is a throwaway machine, so the tests that change the
      # appearance (tests/watcher-macos/appearance.zsh) may run here.
      - name: Run the tests
        env:
          REAL_APPEARANCE_TESTS: 1
        run: |
          zsh --version
          make test
